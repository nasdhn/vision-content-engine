name: vision-content-engine-local

services:
  postgres:
    image: postgres:18.6-alpine3.23@sha256:8c80c49c67052d82f9aaf4ee1f1881c8926b445a1cc916892934845eb8c24204
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run pnpm local:init}
      POSTGRES_DB: ${POSTGRES_DB:?Run pnpm local:init}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm local:init}
    ports: ['127.0.0.1:55432:5432']
    volumes: ['postgres-data:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 15
    mem_limit: 512m

  redis:
    image: redis:8.6.6-alpine3.23@sha256:af0d872c3773bb5e8fd3cdf8b721e1c6883f7bb27d8273916d86afba702ba5a9
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run pnpm local:init}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Run pnpm local:init}
    command:
      [
        'sh',
        '-c',
        'exec redis-server --requirepass "$${REDIS_PASSWORD}" --appendonly yes --maxmemory-policy noeviction',
      ]
    ports: ['127.0.0.1:56379:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 15
    mem_limit: 256m

  storage:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    command:
      [
        'mini',
        '-dir=/data',
        '-ip=127.0.0.1',
        '-ip.bind=0.0.0.0',
        '-master.telemetry=false',
        '-webdav=false',
        '-admin.ui=false',
        '-volume.max=4',
      ]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Run pnpm local:init}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Run pnpm local:init}
      S3_BUCKET: ${S3_BUCKET:?Run pnpm local:init}
    ports: ['127.0.0.1:58333:8333']
    volumes: ['storage-data:/data']
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8333/readyz']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    mem_limit: 768m

volumes:
  postgres-data:
  redis-data:
  storage-data:
