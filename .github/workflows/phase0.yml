name: Canonical domain, AI and recording checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@10.34.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm local:init
      - run: pnpm prisma:generate
      - name: Install media probe prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Verify media probe prerequisite
        run: ffprobe -version
      - run: pnpm check
      - run: pnpm build:web
      - name: Start pinned local dependencies
        run: docker compose --env-file .env -f infra/compose.yaml up -d --wait --wait-timeout 120
      - run: pnpm db:migrate:local
      - run: pnpm test:postgres
      - run: pnpm test:infra
      - run: pnpm test:storage
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - name: Verify the reviewed SQL preview is reproducible
        run: |
          pnpm db:preview
          git diff --exit-code -- infra/migration-preview/initial.generated.sql
